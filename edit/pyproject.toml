[project]
name = "editkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "glcontext<3.1 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "glcontext>=3.1.0 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "moderngl<5.13 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "moderngl>=5.13.0 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "numpy>=2.5.3",
    "onnxruntime<1.24 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "onnxruntime>=1.30.0 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "pillow>=12.3.0",
    "pyloudnorm>=0.2.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]
